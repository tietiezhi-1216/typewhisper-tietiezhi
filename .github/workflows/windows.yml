name: Windows plugin
on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Offline protocol and installer tests
        run: dotnet run --project windows/Tests/Tietiezhi.Tests.csproj -c Release
      - name: Build Windows packages
        run: python windows/package.py
      - name: Test detached update, install and restart on Windows
        run: |
          $version = (Get-Content windows/Tietiezhi/manifest.json | ConvertFrom-Json).version
          dotnet run --project windows/Tests/Tietiezhi.Tests.csproj -c Release -- --packaged-smoke "windows/dist/tietiezhi-$version-windows-x64.zip"
